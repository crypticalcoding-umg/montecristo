.bg::after{content:"";position:absolute;inset:0;background:var(--tint);transition:background .3s}
.bg.blur::after{background:linear-gradient(180deg,rgba(20,38,72,.18),rgba(20,38,72,.34))}
.bg.login-bg::after{background:linear-gradient(180deg,rgba(14,28,56,.12),rgba(14,28,56,.34))}
button,input,select,textarea{font:inherit;color:inherit;font-weight:300}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
.muted{color:var(--muted)}.small{font-size:13px}.tnum{font-variant-numeric:tabular-nums}

/* Login */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:28px}
.lcard{width:min(500px,100%);padding:36px 36px 30px;border-radius:44px;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(22px) saturate(1.2);backdrop-filter:blur(22px) saturate(1.2);box-shadow:inset 0 0 40px rgba(255,255,255,.06),0 20px 60px rgba(5,15,40,.35);
  display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px}
.brand svg{width:132px;height:auto}
.brand span{font-size:34px;letter-spacing:.14em;font-weight:300}
.lcard form{width:100%;display:flex;flex-direction:column;gap:14px}
.pin{width:100%;padding:15px 22px;border-radius:99px;border:1.5px solid var(--field-b);background:rgba(255,255,255,.07);font-size:16px;color:#fff}
.pin::placeholder{color:rgba(255,255,255,.78)}
.pin:focus,button:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:2px}
.go{width:100%;padding:16px;border-radius:99px;border:0;background:var(--dark);color:#fff;font-size:16px;font-weight:400;cursor:pointer;margin-top:8px}
.go:hover{background:rgba(10,14,26,.85)}
.lnote{margin:0;color:rgba(255,255,255,.72);font-size:13.5px;max-width:38ch}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px}
.quick .small{width:100%;text-align:center;color:rgba(255,255,255,.85)}
.quick button{padding:8px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;font-size:13px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.quick button:hover{background:rgba(255,255,255,.26)}
.err{color:var(--bad);font-size:13px}
.alert{padding:11px 16px;border-radius:18px;font-size:13.5px;border:1px solid var(--line);background:var(--card-in);text-align:left}
.alert.bad{border-color:var(--bad);color:#ffd5cf}.alert.warn{border-color:var(--warn);color:#ffe0c2}.alert.ok{border-color:var(--ok);color:#d3ffe4}.alert.info{border-color:var(--info)}

/* App */
.app{display:grid;grid-template-columns:clamp(220px,16.5vw,300px) minmax(0,1fr);min-height:100vh;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)))}
aside.nav{background:var(--side);border-right:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:26px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside.nav .brand{padding:0 0 18px;border-bottom:1.5px solid rgba(255,255,255,.55);margin:0 0 14px}
aside.nav .brand svg{width:104px}aside.nav .brand span{font-size:23px}
.nav button.item{display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;border:0;background:transparent;cursor:pointer;text-align:left;color:rgba(255,255,255,.7);font-size:16px}
.nav button.item svg{width:24px;height:24px;flex:none}
.nav button.item:hover{color:#fff;background:rgba(255,255,255,.1)}
.nav button.item[aria-current="page"]{color:#fff;font-weight:400}
.nav .who{margin-top:auto;border-top:1.5px solid rgba(255,255,255,.55);padding-top:14px;display:flex;flex-direction:column;gap:2px}
.nav .who b{font-weight:400;font-size:17px}
.nav .who button{align-self:flex-start;margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:5px 14px;font-size:12.5px;cursor:pointer;color:#fff}
.nav .who button:hover{background:rgba(255,255,255,.14)}
main{padding:26px 34px 40px;display:flex;flex-direction:column;gap:22px;min-width:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.top h1{font-size:clamp(28px,3.4vw,46px);line-height:1.1;font-weight:400}
.top .sub{font-size:16px;color:var(--muted);margin-top:4px}
.clock{padding:10px 26px;border-radius:99px;border:1.5px solid var(--line);background:rgba(255,255,255,.12);font-size:clamp(16px,1.9vw,26px);font-weight:300;white-space:nowrap}
.card{background:var(--card);border:1.5px solid var(--card-b);border-radius:28px;padding:20px 22px;-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);min-width:0;box-shadow:0 8px 30px rgba(8,20,50,.18)}
.card h2,.card .ch{font-size:22px;font-weight:400;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card h3{font-size:19px;font-weight:400;margin-bottom:8px}
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.cols.agenda{grid-template-columns:minmax(260px,.62fr) minmax(0,1.6fr)}
.cols.fact{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:22px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.tile{display:flex;flex-direction:column}
.tile .v{font-size:30px;font-weight:400;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:13.5px}
.btn{padding:11px 22px;border-radius:99px;border:1.5px solid var(--field-b);background:rgba(255,255,255,.14);color:#fff;font-size:15px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn:hover{background:rgba(255,255,255,.28)}
.btn.pri{background:var(--dark);border-color:transparent;font-weight:400}.btn.pri:hover{background:rgba(10,14,26,.88)}
.btn.good{color:var(--ok);border-color:var(--ok);font-weight:400}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 14px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.sel,.in{width:100%;padding:11px 18px;border-radius:99px;border:1.5px solid var(--field-b);background:rgba(255,255,255,.08);color:#fff;font-size:15px}
select.sel,select.in{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M5 9l7 7 7-7'/></svg>");background-repeat:no-repeat;background-position:right 16px center;padding-right:42px}
select option{color:#14213a;background:#fff}
textarea.in{border-radius:22px;min-height:82px;resize:vertical}
.in:focus{outline:2px solid #fff;outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}.toolbar .sel,.toolbar .in{width:auto;min-width:200px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:400;font-size:15px;padding:10px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
table.box th,table.box td{border:1px solid var(--line);text-align:center}
table.box{border-collapse:collapse}
.st{font-weight:500}.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}.st.info{color:var(--info)}.st.mute{color:var(--muted)}

/* Agenda */
.dcard{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.dcard .sel{margin-bottom:6px}
.avatar{width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.7);display:grid;place-items:center;font-size:34px;font-weight:300;flex:none}
.dcard h2{font-size:28px;margin:0}
.dcard hr{width:100%;border:0;border-top:1.5px solid var(--line);margin:8px 0}
.dstats{display:grid;grid-template-columns:1fr 1fr;width:100%}
.dstats b{display:block;font-size:34px;font-weight:300}
.mini{width:100%}
.mini .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:15px}
.mini .mh span::first-letter{text-transform:uppercase}
.mini .mh button{background:transparent;border:0;color:#fff;cursor:pointer;font-size:18px;padding:2px 10px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mg span{font-size:12.5px;color:var(--muted);padding:4px 0}
.mg button{aspect-ratio:1;border-radius:50%;border:0;background:transparent;color:#fff;font-size:14px;cursor:pointer;max-width:42px;justify-self:center;width:100%}
.mg button:hover{background:rgba(255,255,255,.2)}
.mg button.wk{background:rgba(255,255,255,.14)}
.mg button.td{outline:2px solid #fff}
.mg button:disabled{opacity:.4;cursor:default}
.cal{display:grid;grid-template-columns:58px repeat(5,minmax(124px,1fr));min-width:760px;border:1px solid var(--line)}
.cal>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-height:58px;position:relative}
.cal>div:nth-child(6n){border-right:0}
.cal .h{text-align:center;font-size:15px;font-weight:400;min-height:0;padding:9px 6px}
.cal .h.today{background:rgba(255,255,255,.28)}
.cal .t{color:var(--muted);font-size:12.5px;text-align:right;padding-right:8px}
.cal .cell{display:flex;flex-direction:column;gap:4px}
.cal .cell .add{position:absolute;inset:0;border:0;background:transparent;cursor:pointer;opacity:0;font-size:22px;color:#fff}
.cal .cell .add:hover,.cal .cell .add:focus-visible{opacity:1;background:rgba(255,255,255,.14)}
.chip{position:relative;z-index:1;text-align:center;padding:6px 6px;border-radius:12px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);cursor:pointer;font-size:12.5px;line-height:1.3;color:#fff}
.chip b{display:block;font-weight:500}
.chip small{display:block;font-size:11.5px;font-weight:500}
.chip small.ok{color:var(--ok)}.chip small.warn{color:var(--warn)}.chip small.info{color:var(--info)}.chip small.mute{color:var(--muted)}.chip small.bad{color:var(--bad)}
.chip.s-canc b{text-decoration:line-through}
.chip:hover{background:rgba(255,255,255,.26)}

/* Consulta y otros */
.hist-i{padding:10px 0;border-bottom:1.5px solid var(--line)}.hist-i:last-child{border-bottom:0}
.hist-i .d{font-size:14px;color:var(--muted)}
.vitals{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vit{border:1.5px solid var(--line);border-radius:20px;padding:12px 16px;background:rgba(255,255,255,.07)}
.vit span{display:block;font-size:16px;color:var(--muted)}
.vit b{font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.sep{border:0;border-top:1.5px solid var(--line);margin:16px 0}
.actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.money div{border:1.5px solid var(--line);border-radius:18px;padding:10px 14px}
.money b{display:block;font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}.money span{font-size:12.5px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bars i{display:block;width:100%;max-width:58px;background:rgba(255,255,255,.7);border-radius:12px 12px 4px 4px;min-height:4px}
.bars b{font-weight:400}
.empty{padding:22px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,18,40,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:26px;border-radius:30px;background:rgba(60,84,128,.7);border:1.5px solid var(--card-b);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:22px}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slots button{padding:5px 12px;border-radius:99px;border:1px solid var(--field-b);background:rgba(255,255,255,.12);cursor:pointer;font-size:13px;color:#fff}
.slots button:hover{background:rgba(255,255,255,.28)}
.counter{text-align:right;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;padding:13px 24px;border-radius:99px;background:rgba(18,24,38,.88);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:400;max-width:calc(100vw - 32px);text-align:center}

@media (max-width:1100px){.cols,.cols.agenda,.cols.fact{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside.nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;border-right:0;border-bottom:1px solid rgba(255,255,255,.28)}
  aside.nav .brand{flex-direction:row;border:0;margin:0;padding:0 10px 0 0;gap:10px}aside.nav .brand svg{width:54px}aside.nav .brand span{font-size:18px}
  .nav .who{margin:0 0 0 auto;border:0;padding:0;flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap}.nav .who button{margin:0}
  main{padding:20px 16px 32px}
}
@media (max-width:520px){.row2,.vitals,.money{grid-template-columns:1fr}.lcard{padding:28px 20px;border-radius:34px}.brand span{font-size:26px}}

function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmtDate(s,o){return parse(s).toLocaleDateString("es-GT",o||{weekday:"short",day:"numeric",month:"short"})}
function Q(n){return "Q "+Number(n).toLocaleString("es-GT",{minimumFractionDigits:2,maximumFractionDigits:2})}
function mins(t){var p=t.split(":");return +p[0]*60+ +p[1]}
function f12(t){var p=t.split(":");var h=+p[0];return (h%12||12)+":"+p[1]+" "+(h<12?"a.m.":"p.m.")}
function initials(n){return n.replace(/^(Dr\.|Dra\.|Enf\.)\s*/,"").split(" ").slice(0,2).map(function(w){return w[0]}).join("").toUpperCase()}
function nowHM(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}

/* ---------- Facturación y Pagos ---------- */
function vFact(){
  var pid=S.fp;
  var pend=PEND.filter(function(x){return x.pid===pid});
  var fl=FACT.filter(function(f){return f.pid===pid}).sort(function(a,b){return a.fecha<b.fecha?1:-1});
  var conSaldo=fl.filter(function(f){return f.abon<f.total});
  var total=pend.reduce(function(a,x){return a+x.monto},0);
  var ids={};PATS.forEach(function(p){if(PEND.some(function(x){return x.pid===p.id})||FACT.some(function(f){return f.pid===p.id}))ids[p.id]=1});
  var psel='<div class="toolbar"><label class="f" style="flex-direction:row;align-items:center;gap:10px;width:100%;max-width:420px">Paciente<select class="sel" id="fa-pat">'+PATS.filter(function(p){return ids[p.id]}).map(function(p){return '<option value="'+p.id+'"'+(pid===p.id?' selected':'')+'>'+esc(p.name)+'</option>'}).join("")+'</select></label></div>';
  var det=pend.length?'<div class="scroll"><table><thead><tr><th>Concepto</th><th class="num">Monto</th></tr></thead><tbody>'+pend.map(function(x){return '<tr><td>'+esc(x.concepto)+' - '+esc(doc(x.did).name)+'</td><td class="num">'+Q(x.monto)+'</td></tr>'}).join("")+'<tr><td>Total</td><td class="num"><b>'+Q(total)+'</b></td></tr></tbody></table></div><div class="actions"><button class="btn" data-act="gen-fact">Generar Factura</button></div>':'<div class="empty">Este paciente no tiene consultas finalizadas por facturar.</div>';
  var cuenta=fl.length?'<div class="scroll"><table class="box"><thead><tr><th>Factura</th><th>Fecha</th><th>Monto</th><th>Abonado</th><th>Estado</th></tr></thead><tbody>'+fl.map(function(f){return '<tr><td>'+f.id+'</td><td>'+fmtDate(f.fecha,{day:"numeric",month:"short",year:"numeric"})+'</td><td class="tnum">'+Q(f.total)+'</td><td class="tnum">'+Q(f.abon)+'</td><td>'+factTxt(f)+'</td></tr>'}).join("")+'</tbody></table></div>':'<div class="empty">Sin facturas registradas.</div>';
  var pago=conSaldo.length?'<form id="f-pago" novalidate style="display:flex;flex-direction:column;gap:14px"><label class="f">Factura<select class="in" id="pg-f">'+conSaldo.map(function(f){return '<option value="'+f.id+'">'+f.id+' - '+Q(f.total-f.abon)+' '+(f.abon>0?'saldo':'pendiente')+'</option>'}).join("")+'</select></label><label class="f">Monto a pagar<input class="in" id="pg-m" inputmode="decimal" placeholder="Q 0.00"></label><label class="f">Método de pago<select class="in" id="pg-t"><option>Efectivo</option><option>Tarjeta</option><option>Transferencia</option></select></label><div id="pg-e"></div><div class="actions" style="margin-top:0"><button class="btn pri" type="submit">Registrar pago</button></div></form>':'<div class="empty">Este paciente no tiene saldo pendiente.</div>';
  return psel+'<div class="cols fact"><div class="stack"><section class="card"><h2>Detalle de consulta</h2>'+det+'</section><section class="card"><h2>Estado de Cuenta del Paciente</h2>'+cuenta+'</section></div><section class="card"><h2>Registrar Pago</h2>'+pago+'</section></div>'
}

   '<section class="card"><h2 style="margin-bottom:2px">Signos Vitales</h2>'+(v?'<div class="muted small" style="margin-bottom:12px">Registrados por '+esc(v.por||"Enfermería")+(v.hora?', '+esc(v.hora):'')+'</div><div class="vitals"><div class="vit"><span>Presión arterial</span><b>'+v.sis+'/'+v.dia+' mmHg</b></div><div class="vit"><span>Frecuencia cardíaca</span><b>'+v.fc+' lpm</b></div><div class="vit"><span>Temperatura</span><b>'+v.temp+' °C</b></div><div class="vit"><span>Peso</span><b>'+v.peso+' kg</b></div><div class="vit"><span>Saturación de oxígeno</span><b>'+v.spo2+' %</b></div><div class="vit"><span>Talla</span><b>'+v.talla+' cm</b></div></div>'+(v.obs?'<p class="small muted" style="margin:12px 0 0">Observación de enfermería: '+esc(v.obs)+'</p>':''):'<div class="empty">Sin registro de signos vitales.</div>')+'</section></div>'+
   '<section class="card"><form id="consulta" novalidate><h2>Diagnóstico y Tratamiento</h2><label class="f">Diagnóstico<textarea class="in" id="cs-diag" style="min-height:62px"'+dis+'>'+esc(k.diag||"")+'</textarea></label><label class="f" style="margin-top:12px">Tratamiento / Indicaciones<textarea class="in" id="cs-trat" style="min-height:110px"'+dis+'>'+esc(k.trat||"")+'</textarea></label><hr class="sep"><h2>Indicaciones de Seguimiento</h2><label class="f">Asignar seguimiento a<select class="in" id="cs-asig"'+dis+'>'+enf.map(function(u){return '<option'+(k.asig===u.name?' selected':'')+'>Enf. '+esc(u.name)+'</option>'}).join("")+'</select></label><label class="f" style="margin-top:12px">Notas de seguimiento<input class="in" id="cs-ind" value="'+esc(k.ind||"")+'"'+dis+'></label><div class="err" id="cs-err" role="alert" style="margin-top:10px"></div>'+
   (done?'<div class="alert ok" style="margin-top:12px">Consulta finalizada. Ya está disponible para facturación.</div>':'<div class="actions"><button class="btn" type="button" data-act="borrador">Guardar Borrador</button><button class="btn good" type="submit">Finalizar Consulta</button></div>')+'</form></section></div>'
}

/* ---------- modales ---------- */
function openModal(html){$("#modal-root").innerHTML='<div class="overlay" data-act="close-bg"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';var f=$("#modal-root input,#modal-root select,#modal-root textarea");if(f)f.focus()}
function closeModal(){$("#modal-root").innerHTML=""}
function toast(t){var el=$("#toast-root");el.innerHTML='<div class="toast">'+esc(t)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){el.innerHTML=""},3200)}
function docSel(id,sel){return '<select class="in" id="'+id+'">'+DOCS.map(function(d){return '<option value="'+d.id+'"'+(sel===d.id?' selected':'')+'>'+esc(d.name)+' · '+esc(d.esp)+'</option>'}).join("")+'</select>'}
function timeSel(id,sel){return '<select class="in" id="'+id+'">'+TIMES.map(function(t){return '<option value="'+t+'"'+(sel===t?' selected':'')+'>'+f12(t)+'</option>'}).join("")+'</select>'}
function citaModal(o){
  o=o||{};
  var pOpts=PATS.map(function(p){return '<option value="'+p.id+'"'+(o.p===p.id?' selected':'')+'>'+esc(p.name)+'</option>'}).join("");
  var d0=o.d||(S.week===0?TODAY:weekDates()[0]);
  openModal('<h2>Nueva cita</h2><form id="f-cita" novalidate style="display:flex;flex-direction:column;gap:12px"><label class="f">Paciente<select class="in" id="nc-p">'+pOpts+'</select></label><label class="f">Médico'+docSel("nc-d",S.doc)+'</label><div class="row2"><label class="f">Fecha<input class="in" type="date" id="nc-f" value="'+d0+'"></label><label class="f">Hora'+timeSel("nc-t",o.t||"08:00")+'</label></div><label class="f">Motivo de la consulta<input class="in" id="nc-m" maxlength="80" placeholder="Ej. Control de seguimiento"></label><label class="f">Comentarios para el médico (opcional)<textarea class="in" id="nc-c" maxlength="500"></textarea></label><div class="counter" id="nc-n">0 / 500</div><div id="nc-e"></div><div class="actions" style="margin-top:0"><button class="btn" type="button" data-act="close">Cancelar</button><button class="btn pri" type="submit">Agendar cita</button></div></form>')
}
function conflict(did,date,time,ignore){return CITAS.filter(function(c){return c.id!==ignore&&c.did===did&&c.date===date&&c.est!=="Cancelada"&&Math.abs(mins(c.time)-mins(time))<30})[0]}
function freeSlots(did,date,ignore){return TIMES.filter(function(t){return !conflict(did,date,t,ignore)}).slice(0,5)}
function dateErr(date){
  if(!date)return "Seleccione una fecha.";
  var d=parse(date);if(d.getDay()===0||d.getDay()===6)return "El centro atiende de lunes a viernes. Elija un día hábil.";
  if(date<TODAY)return "No se puede agendar en una fecha pasada.";return ""
}
function showCitaErr(did,date,time,ignore,box,idT){
  var e=dateErr(date),html="";
  if(e)html='<div class="alert bad" role="alert">'+e+'</div>';
  else{var c=conflict(did,date,time,ignore);if(c)html='<div class="alert bad" role="alert">'+esc(doc(did).name)+' ya tiene una cita a las '+f12(c.time)+' ese día. Elija otro horario.<div class="slots" style="margin-top:8px">'+freeSlots(did,date,ignore).map(function(t){return '<button type="button" data-act="pick-slot" data-t="'+t+'" data-for="'+idT+'">'+f12(t)+'</button>'}).join("")+'</div></div>'}
  $(box).innerHTML=html;return !html
}
function editModal(id){
  var c=cita(id),p=pat(c.pid),d=doc(c.did);
  openModal('<h2>Cita de '+esc(p.name)+'</h2><div class="muted small">'+esc(d.name)+' · '+esc(d.esp)+'</div><div class="alert info"><b style="font-weight:500">'+fmtDate(c.date,{weekday:"long",day:"numeric",month:"long"})+', '+f12(c.time)+'</b> · '+estTxt(c.est)+'<div style="margin-top:6px">Motivo: '+esc(c.motivo)+(c.com?'<br>Comentario: '+esc(c.com):'')+'</div></div>'+
   (c.est==="Atendida"||c.est==="Cancelada"?'<div class="actions"><button class="btn" data-act="close">Cerrar</button></div>':
   '<form id="f-edit" data-id="'+id+'" novalidate style="display:flex;flex-direction:column;gap:12px"><h3>Reprogramar</h3><div class="row2"><label class="f">Nueva fecha<input class="in" type="date" id="ed-f" value="'+c.date+'"></label><label class="f">Nueva hora'+timeSel("ed-t",c.time)+'</label></div><div id="ed-e"></div><div class="actions" id="ed-actions" style="margin-top:0">'+(c.est==="Por confirmar"?'<button class="btn" type="button" data-act="conf" data-id="'+id+'">Confirmar cita</button>':'')+'<button class="btn bad" type="button" data-act="cancel-ask" data-id="'+id+'">Cancelar cita</button><button class="btn pri" type="submit">Reprogramar</button></div></form>'))
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;var a=t.dataset.act;
  if(a==="close-bg"){if(e.target===t)closeModal();return}
  if(a==="close"){closeModal();return}
  if(a==="quick"){var u=USERS.filter(function(x){return x.id===DEMO[t.dataset.r]})[0];S.login={mail:u.mail,pass:"demo1234",err:""};render();return}
  if(a==="logout"){S.user=null;S.view="";S.login={mail:"",pass:"",err:""};render();return}
  if(a==="nav"){S.view=t.dataset.v;S.noVit=false;render();window.scrollTo(0,0);return}
  if(a==="calm"){S.calM+=+t.dataset.n;render();return}
  if(a==="pickday"){var dt=parse(t.dataset.d);S.week=Math.round((monday(dt)-MON)/604800000);S.calM=0;render();return}

  if(a==="conf"){cita(t.dataset.id).est="Confirmada";closeModal();render();toast("Cita confirmada. Se notificó al paciente.");return}
  if(a==="cancel-ask"){$("#ed-actions").innerHTML='<span class="small" style="margin-right:auto;align-self:center">¿Cancelar esta cita? Se notificará al paciente.</span><button class="btn" type="button" data-act="close">Volver</button><button class="btn bad" type="button" data-act="cancel-do" data-id="'+t.dataset.id+'">Sí, cancelar cita</button>';return}
  if(a==="cancel-do"){cita(t.dataset.id).est="Cancelada";closeModal();render();toast("Cita cancelada y paciente notificado.");return}
  if(a==="m-pac"){openModal('<h2>Nuevo paciente</h2><form id="f-pac" novalidate style="display:flex;flex-direction:column;gap:12px"><label class="f">Nombre completo<input class="in" id="np-n"></label><div class="row2"><label class="f">Edad<input class="in" id="np-e" inputmode="numeric"></label><label class="f">Teléfono (8 dígitos)<input class="in" id="np-t" inputmode="numeric" placeholder="5512 3401"></label></div><div id="np-err"></div><div class="actions" style="margin-top:0"><button class="btn" type="button" data-act="close">Cancelar</button><button class="btn pri" type="submit">Guardar paciente</button></div></form>');return}
  if(a==="m-user"){openModal('<h2>Nuevo usuario</h2><form id="f-user" novalidate style="display:flex;flex-direction:column;gap:12px"><label class="f">Nombre completo<input class="in" id="nu-n"></label><label class="f">Correo institucional<input class="in" id="nu-m" type="email" placeholder="nombre@montecristo.demo"></label><label class="f">Rol<select class="in" id="nu-r"><option>Recepcionista</option><option>Médico</option><option>Enfermero(a)</option><option>Administrador</option></select></label><div id="nu-err"></div><div class="actions" style="margin-top:0"><button class="btn" type="button" data-act="close">Cancelar</button><button class="btn pri" type="submit">Crear usuario</button></div></form>');return}
  if(a==="toggle-user"){var us=USERS.filter(function(x){return x.id===t.dataset.id})[0];if(us.id===S.user.id){toast("No puede desactivar su propia cuenta.");return}us.activo=!us.activo;render();toast(us.activo?"Usuario activado.":"Usuario desactivado.");return}
  if(a==="rep"){S.repTab=t.dataset.t;render();return}
  if(a==="export"){toast("Reporte generado. La descarga estará disponible en la versión final.");return}
  if(a==="gen-fact"){
    var items=PEND.filter(function(x){return x.pid===S.fp});if(!items.length)return;
    var tot=items.reduce(function(s,x){return s+x.monto},0);var n="FAC-"+pad(NEXTF++).padStart(4,"0");
    FACT.push({id:n,pid:S.fp,concepto:items.map(function(x){return x.concepto}).join(", "),total:tot,abon:0,fecha:TODAY});
    PEND=PEND.filter(function(x){return x.pid!==S.fp});render();toast("Factura "+n+" generada por "+Q(tot)+".");return}
  if(a==="m-hist"){var p=pat(t.dataset.id),h=(HIST[p.id]||[]).slice().reverse();openModal('<h2>Historial de '+esc(p.name)+'</h2><div class="muted small">'+p.edad+' años · '+p.tel+'</div><div>'+(h.length?h.map(function(x){return '<div class="hist-i"><div class="d">'+fmtDate(x.f,{day:"2-digit",month:"short",year:"numeric"})+' - '+esc(doc(x.did).name)+'</div>'+esc(x.diag)+(x.trat?' <span class="muted">'+esc(x.trat)+'</span>':'')+'</div>'}).join(""):'<div class="empty">Este paciente aún no tiene consultas registradas.</div>')+'</div><div class="actions" style="margin-top:0"><button class="btn" data-act="close">Cerrar</button></div>');return}
  if(a==="atender"){S.cid=t.dataset.id;S.noVit=false;S.view="consulta";render();window.scrollTo(0,0);return}
  if(a==="no-vit"){S.noVit=true;render();return}
  if(a==="borrador"){var c0=cita(S.cid);CONS[c0.id]={diag:$("#cs-diag").value,trat:$("#cs-trat").value,ind:$("#cs-ind").value,asig:$("#cs-asig").value};toast("Borrador guardado.");return}
  if(a==="vit"){S.cid=t.dataset.id;S.vitErr={};S.view="vitales";render();window.scrollTo(0,0);return}
  if(a==="seg-done"){SEG.filter(function(s){return s.id===t.dataset.id})[0].done=true;render();toast("Indicación marcada como realizada.");return}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="ag-doc"){S.doc=t.value;render()}
  if(t.id==="ag-week"){S.week=+t.value;S.calM=0;render()}
  if(t.id==="fa-pat"){S.fp=t.value;render()}
  if(t.id==="nc-d"||t.id==="nc-f"||t.id==="nc-t"){if($("#nc-e").innerHTML)showCitaErr($("#nc-d").value,$("#nc-f").value,$("#nc-t").value,null,"#nc-e","nc-t")}
  if(t.id==="ed-f"||t.id==="ed-t"){var id=$("#f-edit").dataset.id;if($("#ed-e").innerHTML)showCitaErr(cita(id).did,$("#ed-f").value,$("#ed-t").value,id,"#ed-e","ed-t")}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="nc-c")$("#nc-n").textContent=t.value.length+" / 500";
  if(t.id==="lg-mail")S.login.mail=t.value;if(t.id==="lg-pass")S.login.pass=t.value;
  if(t.id==="pq"){S.pq=t.value;var pos=t.selectionStart;render();var n=$("#pq");n.focus();n.setSelectionRange(pos,pos)}
});
document.addEventListener("submit",function(e){
  e.preventDefault();var f=e.target;
  if(f.id==="login"){
    var u=USERS.filter(function(x){return x.mail===S.login.mail.trim().toLowerCase()})[0];
    if(!u||S.login.pass!=="demo1234"){S.login.err="Usuario o contraseña incorrectos. Revise sus datos e intente de nuevo.";render();return}
    if(!u.activo){S.login.err="Esta cuenta está desactivada. Comuníquese con el administrador.";render();return}
    S.user=u;S.login={mail:"",pass:"",err:""};S.view=NAV[u.rol][0][0];S.week=0;S.calM=0;S.doc=u.did||"d1";S.cid=null;render();toast("Bienvenido(a), "+(u.did?u.name:u.name.split(" ")[0])+".");return}
  if(f.id==="f-cita"){
    var m=$("#nc-m").value.trim();
    if(!m){$("#nc-e").innerHTML='<div class="alert bad" role="alert">Escriba el motivo de la consulta.</div>';return}
    var did=$("#nc-d").value,date=$("#nc-f").value,time=$("#nc-t").value;
    if(!showCitaErr(did,date,time,null,"#nc-e","nc-t"))return;
    CITAS.push({id:"c"+(++CID),pid:$("#nc-p").value,did:did,date:date,time:time,motivo:m,com:$("#nc-c").value.trim(),est:"Confirmada"});
    S.week=Math.round((monday(parse(date))-MON)/604800000);S.calM=0;S.doc=did;closeModal();render();toast("Cita agendada para el "+fmtDate(date)+" a las "+f12(time)+".");return}
  if(f.id==="f-edit"){
    var id=f.dataset.id,c=cita(id),date=$("#ed-f").value,time=$("#ed-t").value;
    if(!showCitaErr(c.did,date,time,id,"#ed-e","ed-t"))return;
    c.date=date;c.time=time;c.est="Confirmada";closeModal();render();toast("Cita reprogramada para el "+fmtDate(date)+" a las "+f12(time)+".");return}
  if(f.id==="f-pac"){
    var n=$("#np-n").value.trim(),ed=+$("#np-e").value,tel=$("#np-t").value.replace(/\s/g,""),er="";
    if(n.split(/\s+/).length<2)er="Escriba el nombre y al menos un apellido.";else if(!(ed>=0&&ed<=110&&$("#np-e").value!==""))er="Indique una edad válida (0 a 110).";else if(!/^\d{8}$/.test(tel))er="El teléfono debe tener 8 dígitos.";
    if(er){$("#np-err").innerHTML='<div class="alert bad" role="alert">'+er+'</div>';return}
    PATS.push({id:"p"+(PATS.length+1),name:n,edad:ed,tel:tel.slice(0,4)+" "+tel.slice(4)});closeModal();render();toast("Paciente registrado.");return}
  if(f.id==="f-user"){
    var nm=$("#nu-n").value.trim(),ml=$("#nu-m").value.trim().toLowerCase(),er2="";
    if(!nm)er2="Escriba el nombre completo.";else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ml))er2="Escriba un correo válido.";else if(USERS.some(function(u){return u.mail===ml}))er2="Ya existe un usuario con ese correo.";
    if(er2){$("#nu-err").innerHTML='<div class="alert bad" role="alert">'+er2+'</div>';return}
    USERS.push({id:"u"+(USERS.length+1),name:nm,rol:$("#nu-r").value,mail:ml,activo:true});closeModal();render();toast("Usuario creado.");return}
  if(f.id==="f-pago"){
    var fa=FACT.filter(function(z){return z.id===$("#pg-f").value})[0],amt=parseFloat($("#pg-m").value.replace(/[^\d.,]/g,"").replace(",",".")),saldo=fa.total-fa.abon;
    if(!(amt>0)){$("#pg-e").innerHTML='<div class="alert bad" role="alert">Escriba un monto mayor a cero.</div>';return}
    if(amt>saldo+1e-9){$("#pg-e").innerHTML='<div class="alert bad" role="alert">El monto no puede exceder el saldo pendiente de '+Q(saldo)+'.</div>';return}
    fa.abon=Math.round((fa.abon+amt)*100)/100;render();toast(factEst(fa)==="Pagada"?"Pago registrado. La factura quedó pagada.":"Pago parcial registrado. Saldo: "+Q(fa.total-fa.abon)+".");return}
  if(f.id==="consulta"){
    var d=$("#cs-diag").value.trim(),tr=$("#cs-trat").value.trim(),ind=$("#cs-ind").value.trim(),asig=$("#cs-asig").value;
    if(!d||!tr){$("#cs-err").textContent="Complete el diagnóstico y el tratamiento para finalizar la consulta.";return}
    var c2=cita(S.cid);CONS[c2.id]={diag:d,trat:tr,ind:ind,asig:asig};c2.est="Atendida";
    (HIST[c2.pid]=HIST[c2.pid]||[]).push({f:TODAY,did:c2.did,diag:d,trat:tr});
    if(ind)SEG.push({id:"s"+(SEG.length+1),pid:c2.pid,ind:ind+" ("+asig+")",done:false,fecha:TODAY});
    PEND.push({id:"x"+(PEND.length+1)+"-"+c2.id,pid:c2.pid,did:c2.did,fecha:TODAY,concepto:"Consulta "+doc(c2.did).esp,monto:doc(c2.did).tarifa});
    S.view="hoy";S.cid=null;render();toast("Consulta finalizada. Disponible para facturación.");return}
  if(f.id==="vitales"){
    var vals={},errs={};
    VF.forEach(function(x){var raw=$("#v-"+x[0]).value.trim().replace(",","."),n=parseFloat(raw);
      if(raw===""||isNaN(n))errs[x[0]]="Ingrese un valor numérico.";
      else if(n<x[3]||n>x[4])errs[x[0]]="Fuera de rango. Debe estar entre "+x[3]+" y "+x[4]+" "+x[2]+".";
      else vals[x[0]]=n});
    if(Object.keys(errs).length){S.vitErr=errs;render();return}
    vals.obs=$("#v-obs").value.trim();vals.por="Enf. "+S.user.name;vals.hora=f12(nowHM());VIT[S.cid]=vals;
    var c3=cita(S.cid);if(c3.est!=="Atendida")c3.est="En espera";S.vitErr={};S.view="cola";render();toast("Signos vitales guardados. El médico ya puede verlos.");return}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
window.MC={CITAS:CITAS,FACT:FACT,DOCS:DOCS,PATS:PATS,HIST:HIST,TODAY:TODAY,MON:MON,TIMES:TIMES,conflict:conflict,f12:f12,fmtDate:fmtDate,Q:Q,pad:pad,iso:iso,parse:parse,addDays:addDays,esc:esc,doc:doc,pat:pat,factEst:factEst,nowHM:nowHM,refresh:function(){S.noVit=false;render()},brand:brand,LOGO:LOGO};
setInterval(function(){var c=$("#clock");if(c)c.textContent=nowHM()},20000);
render();
})();
</script>
<script>
(function(){
"use strict";
var M=window.MC;
var $=function(s){return document.querySelector(s)};
var esc=M.esc,f12=M.f12,Q=M.Q,pad=M.pad,iso=M.iso,parse=M.parse,addDays=M.addDays,fmtDate=M.fmtDate;
var PID="p1";
var ME=M.pat(PID);
var MS={tab:"inicio",welcome:true,sub:"",seg:"prox",sheet:null,big:false,notif:{rec:true,fact:true},bk:{did:"d1",date:"",time:"",motivo:"",com:"",done:null},toast:""};
var EST={"Confirmada":"ok","Por confirmar":"warn","En espera":"info","Atendida":"mute","Cancelada":"bad"};
var IC={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 plus:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 10h18M12 13v5M9.5 15.5h5"/>',
 list:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 10h18"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 4-6 8-6s7.2 1.8 8 6"/>'
};
function ic(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'}
function doc(id){return M.doc(id)}
function weekdays(n){var out=[],d=parse(M.TODAY);while(out.length<n){if(d.getDay()!==0&&d.getDay()!==6)out.push(iso(d));d=addDays(d,1)}return out}
function chipDate(s){var d=parse(s);return d.toLocaleDateString("es-GT",{weekday:"short"}).replace(".","")+" "+d.getDate()}
function slots(did,date,ignore){
  return M.TIMES.map(function(t){return {t:t,free:!M.conflict(did,date,t,ignore)&&!(date===M.TODAY&&t<=M.nowHM())}})
}
function firstDateWithSlots(did,ignore){var ds=weekdays(10);for(var i=0;i<ds.length;i++){if(slots(did,ds[i],ignore).some(function(x){return x.free}))return ds[i]}return ds[0]}
function proximas(){return M.CITAS.filter(function(c){return c.pid===PID&&c.est!=="Cancelada"&&c.est!=="Atendida"&&c.date>=M.TODAY}).sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1})}
function pasadas(){
  var h=(M.HIST[PID]||[]).map(function(x){return {date:x.f,did:x.did,motivo:x.diag,est:"Atendida"}});
  var c=M.CITAS.filter(function(c){return c.pid===PID&&(c.est==="Atendida"||c.est==="Cancelada")}).map(function(c){return {date:c.date,did:c.did,motivo:c.motivo,est:c.est}});
  return h.concat(c).sort(function(a,b){return a.date<b.date?1:-1})
}
function mfacts(){return M.FACT.filter(function(f){return f.pid===PID})}
function saldo(){return mfacts().reduce(function(a,f){return a+(f.total-f.abon)},0)}

function render(){
  var sc=$("#screen"),mc=$("#mc");
  sc.className="screen"+(MS.welcome?"":" inner")+(MS.big?" big":"");
  if(MS.welcome){mc.innerHTML=welcome();return}
  var body={inicio:sInicio,agendar:sAgendar,citas:sCitas,perfil:sPerfil}[MS.tab]();
  if(MS.sub==="facturas")body=sFacturas();
  var tabs=[["inicio","Inicio","home"],["agendar","Agendar","plus"],["citas","Mis citas","list"],["perfil","Perfil","user"]];
  mc.innerHTML='<div class="mscroll" id="msc">'+body+'</div><nav class="tb" aria-label="Navegación principal">'+tabs.map(function(t){return '<button data-t="'+t[0]+'"'+(MS.tab===t[0]?' aria-current="page"':'')+'>'+ic(t[2])+'<span>'+t[1]+'</span></button>'}).join("")+'</nav>'+(MS.sheet?sheet():'')+(MS.toast?'<div class="mtoast" role="status">'+esc(MS.toast)+'</div>':'')
}
function toast(t){MS.toast=t;render();clearTimeout(toast.t);toast.t=setTimeout(function(){MS.toast="";render()},2800)}
function welcome(){
  return '<div class="mscroll mwel">'+M.brand()+'<p>Agende sus citas, consulte su historial y sus facturas desde su teléfono.</p><button class="mb pri" data-a="start">Comenzar</button><p style="font-size:.8em;opacity:.8">Prototipo con datos de ejemplo</p></div>'
}
function citaCard(c,acts){
  var d=doc(c.did);
  return '<div class="mcard"><div class="mrow" style="align-items:flex-start"><div style="flex:1"><div class="mbig">'+f12(c.time)+'</div><div class="msub" style="margin:0">'+fmtDate(c.date,{weekday:"long",day:"numeric",month:"long"})+'</div></div><span class="mst '+EST[c.est]+'" style="flex:none">'+esc(c.est)+'</span></div><hr class="mdiv"><div>'+esc(d.name)+'</div><div class="msub" style="margin:0">'+esc(d.esp)+'</div><div class="msub">Motivo: '+esc(c.motivo)+'</div>'+(acts?'<div class="mrow" style="margin-top:.7em"><button class="mb" data-a="reprog" data-id="'+c.id+'">Reprogramar</button><button class="mb bad" data-a="cancel" data-id="'+c.id+'">Cancelar cita</button></div>':'')+'</div>'
}
function sInicio(){
  var p=proximas(),first=p[0];
  var hist=(M.HIST[PID]||[]).slice(-1)[0];
  return '<div><h1 class="mh1">Hola, '+esc(ME.name.split(" ")[0])+'</h1><div class="msub">'+fmtDate(M.TODAY,{weekday:"long",day:"numeric",month:"long"})+'</div></div>'+
   '<div><span class="mlbl">Próxima cita</span>'+(first?citaCard(first,true):'<div class="mcard"><div>No tiene citas próximas.</div><button class="mb pri" style="margin-top:.7em;width:100%" data-t="agendar">Agendar una cita</button></div>')+'</div>'+
   '<div class="mrow"><button class="mtile" data-t="agendar"><b>Agendar cita</b><span>Elegir médico y horario</span></button><button class="mtile" data-a="facturas"><b>Mis facturas</b><span>Saldo '+Q(saldo())+'</span></button></div>'+
   (hist?'<div class="mcard"><h2>Última consulta</h2><div class="msub" style="margin:0">'+fmtDate(hist.f,{day:"numeric",month:"long",year:"numeric"})+' · '+esc(doc(hist.did).name)+'</div><div style="margin-top:.4em">'+esc(hist.diag)+'</div></div>':'')
}
function sAgendar(){
  var B=MS.bk;
  if(B.done){var c=B.done;return '<div class="mcard" style="text-align:center"><div class="mav" style="background:var(--ok);border-color:transparent;color:#06222c">✓</div><h2 style="margin-top:.6em;font-size:1.3em">Cita agendada</h2><div class="msub">'+fmtDate(c.date,{weekday:"long",day:"numeric",month:"long"})+', '+f12(c.time)+'</div><div>'+esc(doc(c.did).name)+'</div><div class="msub">Queda por confirmar. Recibirá un aviso cuando recepción la confirme.</div></div><button class="mb pri" data-a="bk-end">Volver al inicio</button>'}
  if(!B.date)B.date=firstDateWithSlots(B.did);
  var ss=slots(B.did,B.date),ds=weekdays(10);
  return '<h1 class="mh1">Agendar cita</h1><div class="mcard"><label class="mlbl" for="bk-d">Médico</label><select class="mf" id="bk-d">'+M.DOCS.map(function(d){return '<option value="'+d.id+'"'+(B.did===d.id?' selected':'')+'>'+esc(d.name)+' · '+esc(d.esp)+'</option>'}).join("")+'</select>'+
   '<span class="mlbl" style="margin-top:.8em">Fecha</span><div class="chips">'+ds.map(function(d){return '<button class="mchip" data-a="bk-date" data-v="'+d+'" aria-pressed="'+(B.date===d)+'">'+chipDate(d)+'</button>'}).join("")+'</div>'+
   '<span class="mlbl" style="margin-top:.5em">Hora</span><div class="chips wrap">'+ss.map(function(x){return '<button class="mchip" data-a="bk-time" data-v="'+x.t+'" aria-pressed="'+(B.time===x.t)+'"'+(x.free?'':' disabled')+'>'+f12(x.t).replace(" a.m.","").replace(" p.m.","")+'<small style="display:block;font-size:.72em">'+(x.t<"12"?"a.m.":"p.m.")+'</small></button>'}).join("")+'</div></div>'+
   '<div class="mcard"><label class="mlbl" for="bk-m">Motivo de la consulta</label><input class="mf" id="bk-m" maxlength="80" placeholder="Ej. Control de seguimiento" value="'+esc(B.motivo)+'"><label class="mlbl" for="bk-c" style="margin-top:.8em">Comentarios para el médico (opcional)</label><textarea class="mf" id="bk-c" maxlength="500" placeholder="Describa sus síntomas">'+esc(B.com)+'</textarea><div style="text-align:right;font-size:.8em;color:var(--muted)" id="bk-n">'+B.com.length+' / 500</div></div>'+
   (B.err?'<div class="mcard" style="border-color:var(--bad);color:#ffd5cf" role="alert">'+esc(B.err)+'</div>':'')+'<button class="mb pri" data-a="bk-go">Confirmar cita</button>'
}
function sCitas(){
  var seg='<div class="mrow"><button class="mchip" data-a="seg" data-v="prox" aria-pressed="'+(MS.seg==="prox")+'">Próximas</button><button class="mchip" data-a="seg" data-v="pas" aria-pressed="'+(MS.seg==="pas")+'">Historial</button></div>';
  var body;
  if(MS.seg==="prox"){var p=proximas();body=p.length?p.map(function(c){return citaCard(c,true)}).join(""):'<div class="mcard"><div>No tiene citas próximas.</div></div>'}
  else{var h=pasadas();body=h.length?h.map(function(x){return '<div class="mcard"><div class="mrow"><div style="flex:1"><div>'+fmtDate(x.date,{day:"numeric",month:"long",year:"numeric"})+'</div><div class="msub" style="margin:0">'+esc(doc(x.did).name)+'</div></div><span class="mst '+EST[x.est]+'" style="flex:none">'+x.est+'</span></div><div class="msub">'+esc(x.motivo)+'</div></div>'}).join(""):'<div class="mcard">Aún no tiene consultas.</div>'}
  return '<h1 class="mh1">Mis citas</h1>'+seg+body
}
function sFacturas(){
  var fl=mfacts().sort(function(a,b){return a.fecha<b.fecha?1:-1});
  return '<button class="mback" data-a="back">‹ Volver</button><h1 class="mh1">Mis facturas</h1><div class="mcard"><span class="mlbl">Saldo pendiente</span><div class="mbig">'+Q(saldo())+'</div></div>'+
   fl.map(function(f){var e=M.factEst(f),k={"Pagada":"ok","Pago parcial":"info","Pendiente":"warn"}[e];return '<div class="mcard"><div class="mrow"><div style="flex:1"><b style="font-weight:400">'+f.id+'</b><div class="msub" style="margin:0">'+fmtDate(f.fecha,{day:"numeric",month:"long",year:"numeric"})+'</div></div><span class="mst '+k+'" style="flex:none">'+e+'</span></div><hr class="mdiv"><div class="mkv"><span>Total</span><span>'+Q(f.total)+'</span></div><div class="mkv"><span>Abonado</span><span>'+Q(f.abon)+'</span></div><div class="mkv"><span>Saldo</span><b style="font-weight:500">'+Q(f.total-f.abon)+'</b></div></div>'}).join("")
}
function sPerfil(){
  return '<div class="mav">'+ME.name.split(" ").map(function(w){return w[0]}).join("")+'</div><div style="text-align:center"><h1 class="mh1" style="font-size:1.5em">'+esc(ME.name)+'</h1><div class="msub">bianca.perez@correo.demo · '+esc(ME.tel)+'</div></div>'+
   '<div class="mcard"><h2>Notificaciones</h2><div class="sw"><span>Recordatorios de citas</span><button data-a="sw" data-k="rec" aria-pressed="'+MS.notif.rec+'" aria-label="Recordatorios de citas"></button></div><div class="sw"><span>Avisos de facturas</span><button data-a="sw" data-k="fact" aria-pressed="'+MS.notif.fact+'" aria-label="Avisos de facturas"></button></div></div>'+
   '<div class="mcard"><h2>Accesibilidad</h2><span class="mlbl">Tamaño del texto</span><div class="mrow"><button class="mchip" data-a="size" data-v="n" aria-pressed="'+(!MS.big)+'">Normal</button><button class="mchip" data-a="size" data-v="g" aria-pressed="'+MS.big+'">Grande</button></div></div>'+
   '<button class="mtile" data-a="facturas"><b>Mis facturas</b><span>Saldo pendiente '+Q(saldo())+'</span></button><button class="mb bad" data-a="logout">Cerrar sesión</button>'
}
function sheet(){
  var S=MS.sheet;
  if(S.type==="cancel"){var c=S.c;return '<div class="sheet-bg" data-a="sheet-x"><div class="sheet" role="dialog" aria-modal="true"><h2>¿Cancelar esta cita?</h2><div class="msub" style="margin:0">'+fmtDate(c.date,{weekday:"long",day:"numeric",month:"long"})+', '+f12(c.time)+' · '+esc(doc(c.did).name)+'</div><div class="msub" style="margin:0">Se notificará al centro médico.</div><div class="mrow"><button class="mb" data-a="sheet-close">Volver</button><button class="mb bad" data-a="cancel-do">Sí, cancelar</button></div></div></div>'}
  var c2=S.c,ds=weekdays(10),ss=slots(c2.did,S.date,c2.id);
  return '<div class="sheet-bg" data-a="sheet-x"><div class="sheet" role="dialog" aria-modal="true"><h2>Reprogramar cita</h2><div class="msub" style="margin:0">'+esc(doc(c2.did).name)+'</div><span class="mlbl">Nueva fecha</span><div class="chips">'+ds.map(function(d){return '<button class="mchip" data-a="rp-date" data-v="'+d+'" aria-pressed="'+(S.date===d)+'">'+chipDate(d)+'</button>'}).join("")+'</div><span class="mlbl">Nueva hora</span><div class="chips wrap">'+ss.map(function(x){return '<button class="mchip" data-a="rp-time" data-v="'+x.t+'" aria-pressed="'+(S.time===x.t)+'"'+(x.free?'':' disabled')+'>'+f12(x.t)+'</button>'}).join("")+'</div>'+(S.err?'<div role="alert" style="color:#ffd5cf">'+esc(S.err)+'</div>':'')+'<div class="mrow"><button class="mb" data-a="sheet-close">Cancelar</button><button class="mb pri" data-a="rp-go">Reprogramar</button></div></div></div>'
}
function cita(id){return M.CITAS.filter(function(c){return c.id===id})[0]}
document.addEventListener("click",function(e){
  var t=e.target.closest("#mobile-root [data-a],#mobile-root [data-t]");if(!t)return;
  if(t.dataset.t&&!t.dataset.a){MS.tab=t.dataset.t;MS.sub="";MS.bk.done=null;render();var s=$("#msc");if(s)s.scrollTop=0;return}
  var a=t.dataset.a,B=MS.bk;
  if(a==="start"){MS.welcome=false;render();return}
  if(a==="logout"){MS.welcome=true;MS.tab="inicio";MS.sub="";render();return}
  if(a==="facturas"){MS.sub="facturas";render();return}
  if(a==="back"){MS.sub="";render();return}
  if(a==="seg"){MS.seg=t.dataset.v;render();return}
  if(a==="sw"){MS.notif[t.dataset.k]=!MS.notif[t.dataset.k];render();return}
  if(a==="size"){MS.big=t.dataset.v==="g";render();return}
  if(a==="bk-date"){B.date=t.dataset.v;B.time="";B.err="";render();return}
  if(a==="bk-time"){B.time=t.dataset.v;B.err="";render();return}
  if(a==="bk-end"){B.done=null;B.motivo="";B.com="";B.time="";B.date="";MS.tab="inicio";render();return}
  if(a==="bk-go"){
    B.motivo=($("#bk-m").value||"").trim();B.com=$("#bk-c").value;
    if(!B.time){B.err="Elija una hora disponible.";render();return}
    if(!B.motivo){B.err="Escriba el motivo de la consulta.";render();return}
    if(M.conflict(B.did,B.date,B.time,null)){B.err="Ese horario ya no está disponible. Elija otro.";B.time="";render();return}
    var c={id:"m"+Date.now(),pid:PID,did:B.did,date:B.date,time:B.time,motivo:B.motivo,com:B.com.trim(),est:"Por confirmar"};
    M.CITAS.push(c);B.done=c;B.err="";render();return}
  if(a==="reprog"){var x=cita(t.dataset.id);MS.sheet={type:"reprog",c:x,date:firstDateWithSlots(x.did,x.id),time:"",err:""};render();return}
  if(a==="cancel"){MS.sheet={type:"cancel",c:cita(t.dataset.id)};render();return}
  if(a==="sheet-close"){MS.sheet=null;render();return}
  if(a==="sheet-x"){if(e.target===t){MS.sheet=null;render()}return}
  if(a==="cancel-do"){MS.sheet.c.est="Cancelada";MS.sheet=null;toast("Cita cancelada.");return}
  if(a==="rp-date"){MS.sheet.date=t.dataset.v;MS.sheet.time="";MS.sheet.err="";render();return}
  if(a==="rp-time"){MS.sheet.time=t.dataset.v;MS.sheet.err="";render();return}
  if(a==="rp-go"){var S=MS.sheet;if(!S.time){S.err="Elija una hora disponible.";render();return}
    if(M.conflict(S.c.did,S.date,S.time,S.c.id)){S.err="Ese horario ya no está disponible.";S.time="";render();return}
    S.c.date=S.date;S.c.time=S.time;S.c.est="Por confirmar";MS.sheet=null;toast("Cita reprogramada. Queda por confirmar.");return}
});
document.addEventListener("change",function(e){if(e.target.id==="bk-d"){MS.bk.did=e.target.value;MS.bk.date="";MS.bk.time="";MS.bk.err="";render()}});
document.addEventListener("input",function(e){
  if(e.target.id==="bk-c"){MS.bk.com=e.target.value;var n=$("#bk-n");if(n)n.textContent=e.target.value.length+" / 500"}
  if(e.target.id==="bk-m")MS.bk.motivo=e.target.value;
});
/* tamaño del teléfono y cambio de plataforma */
function fit(){
  var h=window.innerHeight-70,w=Math.min(420,Math.max(280,h*735/1500));
  $("#phone").style.setProperty("--pw",w+"px")
}
window.addEventListener("resize",fit);fit();
function plat(p){
  document.body.dataset.p=p;
  $("#p-web").setAttribute("aria-pressed",p==="web");$("#p-mov").setAttribute("aria-pressed",p==="movil");
  if(p==="movil"){render();fit()}else{M.refresh()}
  window.scrollTo(0,0)
}
$("#p-web").addEventListener("click",function(){plat("web")});
$("#p-mov").addEventListener("click",function(){plat("movil")});
plat(location.hash==="#movil"?"movil":"web");
})();
</script>
